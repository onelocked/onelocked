<svg xmlns="http://www.w3.org/2000/svg" width="820" height="492" viewBox="0 0 820 492" role="img" aria-label="Peak terminal taste">
<defs>
<style>
.mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:15px}
.prompt{fill:#d8d8e0} .cmd{fill:#f2f2f5} .out{fill:#8a8a94} .err{fill:#ffffff}
.cur{fill:#d8d8e0;animation:blink 1s steps(1) infinite}
.tab{font-family:'Courier New',monospace;font-size:12px;fill:#6a6a74}
@keyframes type{from{width:0}to{width:var(--w)}}
@keyframes show{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes flick{0%,92%,100%{opacity:.04}94%{opacity:.1}96%{opacity:.02}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#131313"/><stop offset="1" stop-color="#050507"/></radialGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
</defs>
<rect x="1" y="1" width="818" height="490" fill="url(#glow)" stroke="#3a3a42" stroke-width="2"/>
<rect x="1" y="1" width="818" height="36" fill="#0d0d10"/>
<text x="22" y="26" class="tab">✝</text>
<text x="46" y="26" class="tab">onelocked@firelink: ~</text>
<line x1="1" y1="37" x2="819" y2="37" stroke="#3a3a42"/>
<text x="40" y="72" class="mono" style="fill:#4a4a42;font-size:12px">Last login: never. 悪魔狩りで忙しい // busy hunting devils.</text>

<!-- whoami -->
<clipPath id="c0"><rect x="40" y="92" width="0" height="22" style="animation:type 0.50s steps(6) 0.80s forwards;--w:91px"/></clipPath><g clip-path="url(#c0)"><text x="40" y="108" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">whoami</tspan></text></g><text x="40" y="134" class="mono out" opacity="0" style="animation:show .01s 1.65s forwards">onelocked</text>

<!-- echo editor -->
<clipPath id="c2"><rect x="40" y="144" width="0" height="22" style="animation:type 1.05s steps(15) 1.95s forwards;--w:172px"/></clipPath><g clip-path="url(#c2)"><text x="40" y="160" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">echo $EDITOR</tspan></text></g><text x="40" y="186" class="mono out" opacity="0" style="animation:show .01s 3.35s forwards">nvim</text>

<!-- ls projects -->
<clipPath id="c4"><rect x="40" y="196" width="0" height="22" style="animation:type 0.91s steps(13) 3.65s forwards;--w:154px"/></clipPath><g clip-path="url(#c4)"><text x="40" y="212" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">ls ~/projects</tspan></text></g><text x="40" y="238" class="mono out" opacity="0" style="animation:show .01s 4.91s forwards">tacet/   nito/   fuzzy-search.yazi/   no-header-prompt.yazi/</text>

<!-- rm music -->
<clipPath id="c6"><rect x="40" y="248" width="0" height="22" style="animation:type 1.26s steps(18) 5.21s forwards;--w:199px"/></clipPath><g clip-path="url(#c6)"><text x="40" y="264" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">sudo rm -rf ~/music</tspan></text></g><text x="40" y="290" class="mono err" opacity="0" style="animation:show .01s 6.82s forwards">rm: command failed, peak music taste cannot be removed.</text>

<!-- nix repl -f '<nixpkgs>' -->
<clipPath id="c8"><rect x="40" y="300" width="0" height="22" style="animation:type 1.61s steps(23) 7.12s forwards;--w:256px"/></clipPath><g clip-path="url(#c8)"><text x="40" y="316" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">nix repl -f '&lt;nixpkgs&gt;'</tspan></text></g>
<text x="40" y="342" class="mono out" opacity="0" style="animation:show .01s 9.00s forwards">Type :? for help.</text>
<text x="40" y="368" class="mono out" opacity="0" style="animation:show .01s 9.20s forwards">Added 6769 variables.</text>

<!-- :t lib.evalModules -->
<clipPath id="c10"><rect x="40" y="378" width="0" height="22" style="animation:type 1.26s steps(18) 9.60s forwards;--w:285px"/></clipPath><g clip-path="url(#c10)"><text x="40" y="394" class="mono"><tspan class="prompt">nix-repl&gt; </tspan><tspan class="cmd">:t lib.evalModules</tspan></text></g><text x="40" y="420" class="mono err" opacity="0" style="animation:show .01s 11.30s forwards">Module system so good, even a devil may cry</text>

<text x="40" y="446" class="mono" opacity="0" style="animation:show .01s 11.60s forwards"><tspan class="prompt">nix-repl&gt; </tspan><tspan class="cur">█</tspan></text>

<rect x="1" y="38" width="818" height="452" fill="url(#scan)" pointer-events="none"/>
<rect x="1" y="38" width="818" height="452" fill="#c8c8d0" style="animation:flick 6s infinite" pointer-events="none"/>
</svg>
